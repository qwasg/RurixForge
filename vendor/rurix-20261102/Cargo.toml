[workspace]
resolver = "2"
members = [
  "src/image-io",
  "src/rurix-asset",
  "src/rurix-basis-sys",
  "src/rurix-d3d12",
  "src/rurix-geom-build",
  "src/rurix-geom-pages",
  "src/rurix-pkg",
  "src/rurix-render",
  "src/rurix-rt",
  "src/rurixc",
  "src/soft-raster",
]

[workspace.package]
edition = "2024"
version = "1.0.0"
publish = false
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "deny"        # unsafe 纪律(10 §7.6):出现 unsafe 前须先建 unsafe-audit 注册条目,届时按块豁免

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

