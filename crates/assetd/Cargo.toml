[package]
name = "assetd"
description = "Forge 资产守护库(08 §1):项目布局/.meta+GUID/缓存键/gltf 导入/rurix-geom-build 网格构建/引用图;被 asset-pipeline-mcp 内嵌,不暴露网络端口"
version.workspace = true
edition.workspace = true

[dependencies]
# 上游复用(03 §4):gltf 严格导入 + 六表 + ImportedMesh 真实几何;rurix-geom-build
# 离线 DAG 构建(RXGB .rxmesh);rurix-pkg 手写 SHA-256(缓存键)。
rurix-asset = { path = "H:/rurix/src/rurix-asset" }
rurix-geom-build = { path = "H:/rurix/src/rurix-geom-build" }
rurix-pkg = { path = "H:/rurix/src/rurix-pkg" }
serde.workspace = true
serde_json.workspace = true
# .meta sidecar = YAML(08 §3.2;serde_yaml 纯 Rust 无原生依赖)。
serde_yaml = "0.9"
# GUID v4(纯 Rust;创建即定永不复用,引用一律 GUID)。
uuid = { version = "1", features = ["v4"] }
# 贴图缩略图原图直出(thumb.rs;与 engine-host 同版本)。
base64 = "0.22"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
