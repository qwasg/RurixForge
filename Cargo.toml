[workspace]
members = [
  "crates/forge-scene",
  "crates/engine-host",
  "crates/forge-agentd",
  "crates/mcp/engine-scene-mcp",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.80"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.44", features = ["rt-multi-thread", "net", "macros", "time", "process", "sync"] }
axum = "0.8"
tower = "0.5"
